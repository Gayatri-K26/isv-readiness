[project]
name = "isv-readiness"
version = "0.1.0"
description = "Gap scanner and readiness loop helpers for ai-cloud-validation provider scripts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ai-cloud-validation>=0.8.0",
    "jsonschema>=4.23.0,<5.0.0",
    "pyyaml>=6.0.2,<7.0.0",
]

[project.scripts]
gapctl = "isv_readiness.cli:main"

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
# Local development option when ai-cloud-validation is checked out next to this repo.
# For registry installs, remove this block and let uv/pip resolve ai-cloud-validation normally.
ai-cloud-validation = { path = "../ai-cloud-validation", editable = true }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "A", "UP", "RUF"]
ignore = ["E501"]
