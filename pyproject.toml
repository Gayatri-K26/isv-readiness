[project]
name = "isv-readiness"
version = "0.1.0"
description = "Gap scanner and readiness loop helpers for ai-cloud-validation provider scripts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23.0,<5.0.0",
    "pyyaml>=6.0.2,<7.0.0",
]

[project.scripts]
gapctl = "isv_readiness.cli:main"
gapctl-codex-generator = "isv_readiness.codex_generator:main"
gapctl-claude-generator = "isv_readiness.claude_generator:main"

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
isv_readiness = ["schemas/*.json"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "A", "UP", "RUF"]
ignore = ["E501"]
