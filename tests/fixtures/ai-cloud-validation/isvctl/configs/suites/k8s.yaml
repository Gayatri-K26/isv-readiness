version: "1.0"

tests:
  platform: kubernetes
  validations:
    k8s_node_pools:
      - K8sNodePoolCheck:
          step: create_test_node_pool
          node_type: cpu
      - K8sNodePoolCheck:
          step: create_test_gpu_node_pool
          node_type: gpu

    kubernetes:
      checks:
        K8sNodeCountCheck:
          count: "{{ steps.setup.kubernetes.node_count | default(1, true) }}"
        K8sGpuCapacityCheck:
          expected_total: "{{ steps.setup.kubernetes.total_gpus | default(1, true) }}"

    k8s_storage:
      step: inspect_storage
      phase: test
      owner_hint: platform
      checks:
        - K8sCsiStorageTypesCheck: {}

    future_category:
      FutureValidationCheck: {}

    reframe:
      checks:
        CPUInfoCheck: {}
